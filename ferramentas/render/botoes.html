<!doctype html>
<!-- Mostra os botões de tema do site, ampliados e com fundo transparente, para imagens de apresentação.
     Uso: botoes.html?id=temp&ativo=1  (id vazio = todos os temas lado a lado) -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <base href="/site/">
  <title>Render dos botões</title>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { background: transparent !important; margin: 0; }
    .fila { display: flex; gap: 18px; padding: 24px; zoom: 3; width: max-content; }
    .fila .camada { position: static; margin: 0; width: auto; }
  </style>
</head>
<body>
  <div class="fila" id="fila"></div>
  <script type="module">
    import { CAMADAS } from './dados.js';
    // Mesmos ícones de site/app.js
    const ICONES = {
      temp: '<path d="M10 14.5V5a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0z"/><path d="M12 9v7"/>',
      raios: '<path d="M13 2 5 13h6l-1 9 8-11h-6z"/>',
      luzes: '<circle cx="6" cy="8" r="1.4"/><circle cx="12" cy="6" r="1.4"/><circle cx="17" cy="10" r="1.4"/><circle cx="9" cy="14" r="1.4"/><circle cx="15" cy="17" r="1.4"/><circle cx="6" cy="19" r="1.4"/>',
      gelo: '<path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/><path d="m9 4 3 2 3-2M9 20l3-2 3 2"/>',
      chuva: '<path d="M7 14a4 4 0 0 1 .4-8A5 5 0 0 1 17 7a3.5 3.5 0 0 1 0 7z"/><path d="m8 17-1 3M12 17l-1 3M16 17l-1 3"/>',
    };
    const q = new URLSearchParams(location.search);
    const ids = q.get('id') ? [q.get('id')] : ['temp', 'chuva', 'raios', 'luzes', 'gelo'];
    const ativo = q.get('ativo') === '1';
    for (const id of ids) {
      const c = CAMADAS[id], b = document.createElement('button');
      b.type = 'button'; b.className = 'camada'; b.dataset.id = id;
      b.style.setProperty('--cor', c.cor);
      b.setAttribute('aria-pressed', String(ativo));
      b.innerHTML = `<span class="disco-mini"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONES[id]}</svg></span>`
        + `<span class="rotulo">${c.nome}<span class="estado">${ativo ? 'no disco' : c.som}</span></span>`;
      document.getElementById('fila').appendChild(b);
    }
  </script>
</body>
</html>
